[workspace]
members = [
    "crates/ishou-tokens",
    "crates/ishou-pente",
    "crates/ishou-batente",
    "crates/ishou-render",
    "crates/ishou-cli",
    "crates/ishou-emoji",
]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/ishou"

[workspace.dependencies]
# Published to crates.io — keeps FlakeHub-distributed ishou tarballs
# standalone-buildable (the sibling path dep `{ path = "../irodori" }`
# broke consumers the moment the tarball left the workspace).
irodori = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.clippy]
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
