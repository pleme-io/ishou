[package]
name = "ishou-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ishou — target-specific renderers for the pleme-io design token set"

[dependencies]
ishou-tokens = { version = "0.1.0", path = "../ishou-tokens" }
serde.workspace = true
serde_json.workspace = true
# Typed emission of the Borealis stylix base16/base24 YAML — the scheme
# is an `IndexMap` (slot order = spec slot order) and serde_yaml owns
# the escaping. No string-concatenated YAML for the new target.
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
insta = { version = "1", features = ["filters"] }

[lints]
workspace = true
